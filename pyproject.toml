[project]
name = "taiga-gitlab"
version = "2.0.0"
description = "GitLab Webhook → Taiga status updater"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
taiga_gitlab = ["py.typed"]
